<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新增交付任务 · Step3 结果交付</title>
  <style>
    :root {
      --brand: #7ac143;
      --brand-hover: #6bb03a;
      --brand-light: #eef8e6;
      --text: #1f1f1f;
      --text-secondary: #595959;
      --placeholder: #bfbfbf;
      --border: #d9d9d9;
      --border-light: #e8e8e8;
      --bg-page: #f0f2f5;
      --bg-card: #ffffff;
      --danger: #ff4d4f;
      --radius: 6px;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .modal {
      width: 100%;
      max-width: 920px;
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px 8px;
    }

    .modal-title { font-size: 18px; font-weight: 600; }

    .btn-icon {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #8c8c8c;
      font-size: 18px;
      line-height: 1;
      border-radius: 4px;
    }
    .btn-icon:hover { background: #f5f5f5; color: #595959; }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 48px 24px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      white-space: nowrap;
    }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      flex-shrink: 0;
    }

    .step.active .step-num {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .step.active { color: var(--text); font-weight: 500; }

    .step-line {
      width: 72px;
      height: 1px;
      background: #d9d9d9;
      margin: 0 16px;
      flex-shrink: 0;
    }

    .modal-body { padding: 0 28px 8px; flex: 1; }

    .section {
      background: #fafafa;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 24px 28px 28px;
      min-height: 300px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 32px;
      align-items: start;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-item.hidden { display: none; }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .form-label .req {
      color: var(--danger);
      margin-right: 2px;
    }

    .form-hint {
      font-size: 12px;
      color: #8c8c8c;
      margin-top: 4px;
      line-height: 1.5;
    }

    .preview-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      background: var(--brand-light);
      color: #3d7a1f;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .preview-chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
    }

    .select { position: relative; width: 100%; }

    .select-trigger {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      position: relative;
    }

    .select-trigger:hover { border-color: var(--brand); }

    .select.open .select-trigger,
    .select-trigger:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(122, 193, 67, 0.2);
    }

    .select-trigger .placeholder { color: var(--placeholder); }
    .select-trigger .value { color: var(--text); }

    .select-arrows {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1px;
      pointer-events: none;
      color: #8c8c8c;
      line-height: 1;
    }

    .select-arrows svg { display: block; }

    .select-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      z-index: 50;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      padding: 4px 0;
    }

    .select.open .select-dropdown { display: block; }

    .select-option {
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }

    .select-option:hover { background: var(--brand-light); }

    .select-option.selected {
      background: var(--brand-light);
      color: #3d7a1f;
      font-weight: 500;
    }

    .rule-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .rule-panel.visible { display: flex; }

    .rule-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .rule-tag {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .weekday-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weekday-chip {
      min-width: 44px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .weekday-chip:hover { border-color: var(--brand); color: var(--brand); }

    .weekday-chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 500;
    }

    .month-strategy {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .radio-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      user-select: none;
    }

    .radio-pill:hover { border-color: var(--brand); }

    .radio-pill.active {
      border-color: var(--brand);
      background: var(--brand-light);
      color: #3d7a1f;
      font-weight: 500;
    }

    .radio-pill input { display: none; }

    .input,
    .time-input,
    .number-input {
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input:hover,
    .time-input:hover,
    .number-input:hover { border-color: var(--brand); }

    .input:focus,
    .time-input:focus,
    .number-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(122, 193, 67, 0.2);
    }

    .time-input { width: 120px; }
    .number-input { width: 88px; text-align: center; }
    .input.full { width: 100%; height: 40px; }

    .qty-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-wrap .input { flex: 1; }
    .qty-unit { font-size: 14px; color: var(--text-secondary); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 20px 28px 24px;
    }

    .btn {
      height: 36px;
      padding: 0 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-default {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-default:hover { border-color: var(--brand); color: var(--brand); }

    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 500;
    }
    .btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }

    .demo-note {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      max-width: 90vw;
      text-align: center;
      pointer-events: none;
      opacity: 0.85;
    }

    @media (max-width: 720px) {
      .form-grid { grid-template-columns: 1fr; }
      .stepper { padding: 12px 16px 20px; flex-wrap: wrap; gap: 8px; }
      .step-line { width: 32px; margin: 0 8px; }
    }
  </style>
</head>
<body>
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h1 class="modal-title" id="modalTitle">新增交付任务</h1>
      <button class="btn-icon" type="button" aria-label="关闭">×</button>
    </div>

    <div class="stepper">
      <div class="step">
        <span class="step-num">1</span>
        <span>基础信息</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <span class="step-num">2</span>
        <span>输入配置</span>
      </div>
      <div class="step-line"></div>
      <div class="step active">
        <span class="step-num">3</span>
        <span>结果交付</span>
      </div>
    </div>

    <div class="modal-body">
      <div class="section">
        <div class="section-title">结果交付</div>

        <div class="form-grid">
          <!-- 左上：交付周期 -->
          <div class="form-item">
            <label class="form-label"><span class="req">*</span>交付周期:</label>
            <div class="select" id="cycleSelect" data-name="cycle">
              <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="placeholder">请选择交付周期</span>
                <span class="select-arrows" aria-hidden="true">
                  <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 5L5 1L9 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1L5 5L9 1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </button>
              <div class="select-dropdown" role="listbox">
                <div class="select-option" data-value="realtime">实时交付</div>
                <div class="select-option" data-value="once">一次性交付</div>
                <div class="select-option" data-value="periodic">周期性交付</div>
              </div>
            </div>
          </div>

          <!-- 右上：交付频率（周期性时） -->
          <div class="form-item cycle-dependent" id="freqItem" data-show="periodic">
            <label class="form-label"><span class="req">*</span>交付频率:</label>
            <div class="select" id="freqSelect" data-name="frequency">
              <button type="button" class="select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="placeholder">请选择交付频率</span>
                <span class="select-arrows" aria-hidden="true">
                  <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 5L5 1L9 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1L5 5L9 1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </button>
              <div class="select-dropdown" role="listbox">
                <div class="select-option" data-value="daily">每天</div>
                <div class="select-option" data-value="weekly">每周</div>
                <div class="select-option" data-value="monthly">每月</div>
                <div class="select-option" data-value="custom">自定义</div>
              </div>
            </div>
          </div>

          <!-- 左下：频率规则（周期性时） -->
          <div class="form-item cycle-dependent" id="ruleItem" data-show="periodic">
            <label class="form-label"><span class="req">*</span>频率规则:</label>

            <div class="rule-panel visible" id="ruleEmpty">
              <div class="select">
                <button type="button" class="select-trigger" disabled style="cursor: not-allowed; background: #fafafa;">
                  <span class="placeholder">请先选择交付频率</span>
                  <span class="select-arrows" aria-hidden="true">
                    <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 5L5 1L9 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1L5 5L9 1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </button>
              </div>
            </div>

            <div class="rule-panel" id="ruleDaily">
              <div class="rule-row">
                <span class="rule-tag">每天</span>
                <input type="time" class="time-input" id="dailyTime" value="09:00" />
                <span class="rule-tag">触发</span>
              </div>
              <div class="form-hint">示例：<code>09:00</code></div>
            </div>

            <div class="rule-panel" id="ruleWeekly">
              <div class="weekday-group" id="weekdayGroup">
                <button type="button" class="weekday-chip" data-day="1">周一</button>
                <button type="button" class="weekday-chip" data-day="2">周二</button>
                <button type="button" class="weekday-chip" data-day="3">周三</button>
                <button type="button" class="weekday-chip" data-day="4">周四</button>
                <button type="button" class="weekday-chip active" data-day="5">周五</button>
                <button type="button" class="weekday-chip" data-day="6">周六</button>
                <button type="button" class="weekday-chip" data-day="0">周日</button>
              </div>
              <div class="rule-row">
                <span class="rule-tag">交付时刻</span>
                <input type="time" class="time-input" id="weeklyTime" value="18:00" />
              </div>
              <div class="form-hint">支持多选。示例：<code>周五 18:00</code>；多选：<code>周一、周五 18:00</code></div>
            </div>

            <div class="rule-panel" id="ruleMonthly">
              <div class="month-strategy">
                <label class="radio-pill active" data-strategy="fixed">
                  <input type="radio" name="monthStrategy" value="fixed" checked />
                  固定日
                </label>
                <label class="radio-pill" data-strategy="lastday">
                  <input type="radio" name="monthStrategy" value="lastday" />
                  每月最后一天
                </label>
              </div>
              <div class="rule-row" id="fixedDayRow">
                <span class="rule-tag">每月</span>
                <div class="select" id="monthDaySelect" style="width: 120px;">
                  <button type="button" class="select-trigger">
                    <span class="value">1 日</span>
                    <span class="select-arrows" aria-hidden="true">
                      <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 5L5 1L9 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                      <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1L5 5L9 1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                  </button>
                  <div class="select-dropdown" role="listbox" id="monthDayOptions"></div>
                </div>
                <input type="time" class="time-input" id="monthlyTime" value="09:00" />
              </div>
              <div class="rule-row" id="lastdayRow" style="display: none;">
                <span class="rule-tag">每月最后一天</span>
                <input type="time" class="time-input" id="lastdayTime" value="09:00" />
              </div>
              <div class="form-hint">固定日建议 1–28；选 29/30/31 时小月回退当月最后一天。</div>
            </div>

            <div class="rule-panel" id="ruleCustom">
              <div class="rule-row">
                <span class="rule-tag">每</span>
                <input type="number" class="number-input" id="customInterval" min="1" max="365" value="3" />
                <span class="rule-tag">天</span>
                <input type="time" class="time-input" id="customTime" value="09:00" />
                <span class="rule-tag">触发</span>
              </div>
              <div class="form-hint">示例：<code>每 3 天 09:00</code></div>
            </div>

            <div class="preview-chip" id="rulePreview" style="display: none;"></div>
          </div>

          <!-- 右下：周期交付数量（周期性时） -->
          <div class="form-item cycle-dependent" id="qtyItem" data-show="periodic">
            <label class="form-label"><span class="req">*</span>周期交付数量:</label>
            <div class="qty-wrap">
              <input type="number" class="input" id="periodQty" min="1" placeholder="请输入周期交付数量" value="" />
              <span class="qty-unit">条</span>
            </div>
            <div class="form-hint">每个触发节点计划交付条数。示例：每月推 20 → <code>20</code>；每周 → <code>500</code></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-default">取消</button>
      <button type="button" class="btn btn-primary">上一步</button>
      <button type="button" class="btn btn-primary" id="btnDone">完成</button>
    </div>
  </div>

  <div class="demo-note">先选「交付周期」：实时无额外字段；一次性无额外字段（数据齐后立刻统一推送）；周期性再配频率与规则</div>

  <script>
    (function () {
      const DAY_NAMES = { 1: "周一", 2: "周二", 3: "周三", 4: "周四", 5: "周五", 6: "周六", 0: "周日" };

      const monthDayOptions = document.getElementById("monthDayOptions");
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement("div");
        opt.className = "select-option" + (d === 1 ? " selected" : "");
        opt.dataset.value = String(d);
        opt.textContent = d + " 日" + (d >= 29 ? "（小月回退月末）" : "");
        monthDayOptions.appendChild(opt);
      }
      document.getElementById("monthDaySelect").dataset.value = "1";

      function initSelect(root, { onChange } = {}) {
        const trigger = root.querySelector(".select-trigger");
        const dropdown = root.querySelector(".select-dropdown");
        if (!trigger || !dropdown || trigger.disabled) return;

        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          const willOpen = !root.classList.contains("open");
          closeAllSelects();
          if (willOpen) {
            root.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });

        dropdown.querySelectorAll(".select-option").forEach((opt) => {
          opt.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdown.querySelectorAll(".select-option").forEach((o) => o.classList.remove("selected"));
            opt.classList.add("selected");
            const label = opt.textContent.replace(/（.*）$/, "").trim();
            const span = trigger.querySelector(".placeholder, .value");
            if (span) {
              span.className = "value";
              span.textContent = label;
            }
            root.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
            root.dataset.value = opt.dataset.value;
            if (onChange) onChange(opt.dataset.value, label);
          });
        });
      }

      function closeAllSelects() {
        document.querySelectorAll(".select.open").forEach((s) => {
          s.classList.remove("open");
          const t = s.querySelector(".select-trigger");
          if (t) t.setAttribute("aria-expanded", "false");
        });
      }

      document.addEventListener("click", closeAllSelects);

      const panels = {
        empty: document.getElementById("ruleEmpty"),
        daily: document.getElementById("ruleDaily"),
        weekly: document.getElementById("ruleWeekly"),
        monthly: document.getElementById("ruleMonthly"),
        custom: document.getElementById("ruleCustom"),
      };

      function showPanel(key) {
        Object.entries(panels).forEach(([k, el]) => {
          el.classList.toggle("visible", k === key);
        });
      }

      /* 交付周期联动：
         实时 → 无额外字段
         一次性 → 无额外字段（本批数据全部找到后立刻统一推送）
         周期性 → 交付频率 + 频率规则 + 周期交付数量 */
      function applyCycle(cycle) {
        document.querySelectorAll(".cycle-dependent").forEach((el) => {
          const show = el.dataset.show;
          const visible = cycle && show === cycle;
          el.classList.toggle("hidden", !visible);
        });
        if (cycle !== "periodic") {
          showPanel("empty");
          document.getElementById("rulePreview").style.display = "none";
        } else {
          const freq = document.getElementById("freqSelect").dataset.value;
          if (freq) {
            showPanel(freq);
            updatePreview();
          } else {
            showPanel("empty");
          }
        }
      }

      initSelect(document.getElementById("cycleSelect"), {
        onChange(value) { applyCycle(value); },
      });

      initSelect(document.getElementById("freqSelect"), {
        onChange(value) {
          showPanel(value || "empty");
          updatePreview();
        },
      });

      initSelect(document.getElementById("monthDaySelect"), {
        onChange() { updatePreview(); },
      });

      document.getElementById("weekdayGroup").addEventListener("click", (e) => {
        const chip = e.target.closest(".weekday-chip");
        if (!chip) return;
        chip.classList.toggle("active");
        if (document.querySelectorAll(".weekday-chip.active").length === 0) {
          chip.classList.add("active");
        }
        updatePreview();
      });

      document.querySelectorAll(".radio-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          document.querySelectorAll(".radio-pill").forEach((p) => p.classList.remove("active"));
          pill.classList.add("active");
          pill.querySelector("input").checked = true;
          const isLast = pill.dataset.strategy === "lastday";
          document.getElementById("fixedDayRow").style.display = isLast ? "none" : "flex";
          document.getElementById("lastdayRow").style.display = isLast ? "flex" : "none";
          updatePreview();
        });
      });

      const previewEl = document.getElementById("rulePreview");

      function updatePreview() {
        const cycle = document.getElementById("cycleSelect").dataset.value;
        const freq = document.getElementById("freqSelect").dataset.value;
        if (cycle !== "periodic" || !freq) {
          previewEl.style.display = "none";
          return;
        }

        let text = "";
        if (freq === "daily") {
          text = document.getElementById("dailyTime").value || "09:00";
        } else if (freq === "weekly") {
          const days = [...document.querySelectorAll(".weekday-chip.active")]
            .map((c) => DAY_NAMES[c.dataset.day])
            .join("、");
          text = `${days} ${document.getElementById("weeklyTime").value || "18:00"}`;
        } else if (freq === "monthly") {
          const isLast = document.querySelector('.radio-pill[data-strategy="lastday"]').classList.contains("active");
          if (isLast) {
            text = `每月最后一天 ${document.getElementById("lastdayTime").value || "09:00"}`;
          } else {
            const day = document.getElementById("monthDaySelect").dataset.value || "1";
            text = `每月 ${day} 日 ${document.getElementById("monthlyTime").value || "09:00"}`;
          }
        } else if (freq === "custom") {
          text = `每 ${document.getElementById("customInterval").value || "3"} 天 ${document.getElementById("customTime").value || "09:00"}`;
        }

        if (text) {
          previewEl.style.display = "inline-flex";
          previewEl.textContent = "频率规则预览：" + text;
        } else {
          previewEl.style.display = "none";
        }
      }

      ["dailyTime", "weeklyTime", "monthlyTime", "lastdayTime", "customTime", "customInterval"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener("input", updatePreview);
      });

      /* 初始：与原型一致，展示四宫格（周期性结构），未选周期前也可预览布局 */
      applyCycle("periodic");

      document.getElementById("btnDone").addEventListener("click", () => {
        const cycle = document.getElementById("cycleSelect").dataset.value;
        if (!cycle) {
          alert("请选择交付周期");
          return;
        }
        if (cycle === "periodic") {
          const freq = document.getElementById("freqSelect").dataset.value;
          if (!freq) {
            alert("请选择交付频率");
            return;
          }
          const qty = document.getElementById("periodQty").value;
          if (!qty || Number(qty) < 1) {
            alert("请填写周期交付数量");
            return;
          }
        }

        const cycleLabel = document.querySelector("#cycleSelect .value")?.textContent || cycle;
        let msg = "配置已完成（原型示意）\n\n交付周期：" + cycleLabel;
        if (cycle === "once") {
          msg += "\n说明：本批数据全部找到后，立刻统一推送（无需配置交付时间）";
        } else if (cycle === "realtime") {
          msg += "\n说明：实时交付，无额外周期字段";
        } else if (cycle === "periodic") {
          msg += "\n交付频率：" + (document.querySelector("#freqSelect .value")?.textContent || "");
          if (previewEl.textContent) msg += "\n" + previewEl.textContent;
          msg += "\n周期交付数量：" + document.getElementById("periodQty").value + " 条";
        }
        alert(msg);
      });
    })();
  </script>
</body>
</html>
